 d?ng Warehouse.</text><text x="45" y="1377" font-family="Arial" font-size="15" fill="#334155">C?c API li?n quan s? d?ng th? vi?n d?ng chung theo danh s?ch ? ph?n tr?n; kh?ng c? Sales service hi?n t?i.</text><rect x="30" y="1455" width="1440" height="190" fill="#ffffff" stroke="#334155"/><text x="45" y="1483" font-family="Arial" font-size="17" font-weight="bold">QUY ??C &amp; PH?M VI</text><text x="45" y="1512" font-family="Arial" font-size="15" fill="#334155">N?t ??t ?use?: ph? thu?c package. N?t li?n HTTP/JSON: giao ti?p l?c ch?y, kh?ng ph?i ProjectReference.</text><text x="45" y="1537" font-family="Arial" font-size="15" fill="#334155">API ? BLL / Models c? th? qua tham chi?u b?c c?u t? DAL; h?nh kh?ng ch? li?t k? ProjectReference tr?c ti?p.</text><text x="45" y="1562" font-family="Arial" font-size="15" fill="#334155">Middleware ???c c?u h?nh t?i Program.cs; kh?ng gi? ??nh c? c?c l?p LoggingMiddleware / ValidationMiddleware ri?ng.</text><text x="45" y="1587" font-family="Arial" font-size="15" fill="#334155">WMS.Audit ph?c v? ??c audit; ghi audit hi?n n?m trong repository Procurement / Inventory.</text><text x="45" y="1612" font-family="Arial" font-size="15" fill="#334155">M? h?nh t?ng qu?t to?n backend. L??c b? l?p m?u WeatherForecast / Class1 v? c?ng c? Identity.Seed.</text><polyline points="420,200 360,200" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="390" y="190" text-anchor="middle" font-family="Arial" font-size="13" stroke="white" stroke-width="5" paint-order="stroke">?use?</text><polyline points="1060,200 1120,200" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="1090" y="190" text-anchor="middle" font-family="Arial" font-size="13" stroke="white" stroke-width="5" paint-order="stroke">?use?</text><polyline points="740,275 740,350" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#a)"/><text x="740" y="302.5" text-anchor="middle" font-family=